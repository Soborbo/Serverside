name: CI

# Typecheck + test gate on every PR and on pushes to the main branches.
# 273+ vitest tests existed but nothing ran them automatically — given the
# client↔server contract-drift history (microsoft_ads vs msads), this gate is
# the cheapest insurance against silent regressions.

on:
  pull_request:
  push:
    branches:
      - main
      - 'claude/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # A lockfile-teljesseg or SZANDEKOSAN az `npm ci` ELOTT fut: ugyanazt a
      # hibat meri, csak masodpercek alatt es ertheto uzenettel. A Windowson
      # futtatott `npm install|update` kipucolja a lockfile-bol a mas platformra
      # valo optional agakat (@emnapi/runtime, @esbuild/linux-*, @rollup/*), amitol
      # a Linux-builder `npm ci`-je EUSAGE-dzsel bukik — a fejleszto gepen viszont
      # MINDEN zold, meg a `npm ci --dry-run` is. 2026-08-25-en ket repo CI-jat fogta meg.
      - name: Lockfile completeness (Windows-npm pruning guard)
        run: node scripts/check-lockfile-complete.mjs package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # A KANONIKUS src/events.json nem sodródhat el a deklarált hash-tol (deliberate-
      # edit lock). Kulon lepes (nem csak a vitesten belul), hogy a bukas oka lathato.
      - name: Contract sync-guard
        run: npm run check:contract

      # P0.5 truth-freeze: a doksi a JELENLEGI modellt irja le, nem a celallapotot.
      # Kulon lepes, hogy a bukas oka (melyik cafolt utasitas / hianyzo horgony) lathato
      # legyen a CI-osszefoglaloban, ne egy vitest-stack alatt.
      - name: Doc truth-freeze gate
        run: npm run check:docs

      - name: Test
        run: npm test

  # A soborbo-tracking kliens-lib csomag (2026-07-21 óta itt él, sajat package.json +
  # jsdom vitest). A ../src/events.json-t OLVASSA (egyetlen forras, nincs vendor-masolat).
  tracking-package:
    name: soborbo-tracking package (client lib)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soborbo-tracking
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: soborbo-tracking/package-lock.json

      - name: Lockfile completeness (Windows-npm pruning guard)
        run: node ../scripts/check-lockfile-complete.mjs package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Browser event contract (dataLayer <-> docs <-> GTM <-> canonical events.json)
        run: npm run check:events

      - name: Test (vitest + jsdom)
        run: npm test

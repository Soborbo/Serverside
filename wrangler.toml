# ═════════════════════════════════════════════════════════════════════════════
# event-gateway — there is ONE worker, and THIS top-level config IS production.
#   • Live worker: `event-gateway`, served on custom domain tracking.soborbo.co.uk
#     (see the [[routes]] note near the bottom of this file).
#   • Deploy production:  wrangler deploy        (NO --env)
#   • Local test:         wrangler dev           (or `wrangler deploy --dry-run`)
#   Do NOT add an `[env.production]` block: Wrangler appends the environment name
#   to the worker name, so `--env production` would deploy to a SEPARATE worker
#   `event-gateway-production` (and the custom domain would not follow). One
#   worker → one top-level config. This file is the source of truth — the active
#   bindings below already match the live worker; keep them in sync. See DEPLOY.md.
# ═════════════════════════════════════════════════════════════════════════════
name = "event-gateway"
main = "src/worker.ts"
compatibility_date = "2026-06-25"
compatibility_flags = ["nodejs_compat"]
account_id = "075668606da58c5b96a45a075f1ca99c"

[observability]
enabled = true
head_sampling_rate = 1.0

# ─────────────────────────────────────────────────────────────────────────────
# Secret-ek (`wrangler secret put <NAME>`). FONTOS: EGYIK SEM kell a `wrangler
# deploy`-hoz — mind request-időben olvasódik, guardolva. A /api/event/health
# secret nélkül is 200-at ad. Lásd DEPLOY.md.
#   - TURNSTILE_SECRET_KEY: az EGYETLEN, ami a core happy-path-hoz kell (nélküle
#     minden /api/event/conversion 403 — kivéve ha TURNSTILE_FAILOPEN=1).
#   - GADS_OAUTH_CLIENT_ID / GADS_OAUTH_CLIENT_SECRET / GADS_DEVELOPER_TOKEN:
#     CSAK a Google Ads útvonalhoz (Meta + GA4 nélkülük is megy).
#   - ADMIN_API_TOKEN: az admin API/UI + lead-status auth-jához (nélküle 401).
# Opcionális: TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM_NUMBER,
#   ALLOWED_ORIGINS, TURNSTILE_FAILOPEN (prod-ban NE legyen "1"), QUOTE_ALARM_SECONDS
# Megjegyzés: a GAds OAuth access/refresh tokenek dinamikusan frissülnek →
# szándékosan KV-ben (OAUTH_TOKENS) maradnak, NEM Secrets Store-ban.
# ─────────────────────────────────────────────────────────────────────────────

# ── H1: Cloudflare Queues alapú DLQ retry ───────────────────────────────────
# A kód guardolt: amíg ezek kommentben vannak (nincs DLQ binding), az
# újrapróbálkozás az R2-fallbackre + óránkénti cronra esik vissza. Élesítés:
#   1) wrangler queues create event-gateway-dlq
#   2) wrangler queues create event-gateway-dlq-dead
#   3) vedd ki a kommentből az alábbi 3 blokkot + redeploy
#   4) (opcionális) a lenti [triggers] cron DLQ-sora elhagyható Queues-módban
#
# [[queues.producers]]
# binding = "DLQ"
# queue = "event-gateway-dlq"
#
# [[queues.consumers]]
# queue = "event-gateway-dlq"
# max_batch_size = 10
# max_batch_timeout = 30
# # A worker.ts queue() handler maga kezeli a kimerülést (R2 'dead' archívum a
# # MAX_RETRIES=3 utáni 4. kézbesítésnél). Ezért a platform max_retries-t
# # MAGASABBRA állítjuk (>=4), hogy ne előzze meg a worker logikáját; a
# # dead_letter_queue csak végső biztonsági háló (a kanonikus dead store az R2).
# max_retries = 5
# dead_letter_queue = "event-gateway-dlq-dead"

# ── H2: natív Rate Limiting binding az ingestion végponton ───────────────────
# A kód guardolt: binding nélkül a rate-limit lépés kimarad (csak Turnstile véd).
# 100 kérés / 60s, IP+hostname kulcsra. Élesítés: vedd ki a kommentből + redeploy.
# (A `period` csak 10 vagy 60 lehet; a limiter per-location, eventually consistent.)
#
[[ratelimits]]
name = "INGEST_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

# ── TASK 2: degradált-módú (token-nélküli low-risk) rate limiter ─────────────
# Szűk budget IP+host kulcsra, mert ezek az eventek token nélkül jönnek. Ha nincs
# bekötve, a degradált elfogadás a felső szintű INGEST_LIMITER-re támaszkodik.
# Ugyanez a limiter bound-olja a Turnstile lenient duplicate-elfogadást is
# (token-replay elleni védelem — lásd lib/turnstile.ts).
[[ratelimits]]
name = "DEGRADED_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# Cron Triggers — DLQ retry, daily digest, SLO check.
# AKTÍV: a Sprint 9 route-ok élnek, ezért a scheduled-alrendszernek futnia KELL —
# enélkül a DLQ-retry/retention/reconciliation/SLO sosem fut, és minden DLQ-ba
# került konverzió a 24 órás ablak után végleg elveszne (CLAUDE.md 11).
# (Email binding nélkül a daily-digest soft-skip-pel megy — a cron attól még fut.)
[triggers]
crons = [
  "0 8 * * *",        # Daily digest at 8 AM GMT
  "15 8 * * *",       # Reconciliation drift-check (D1 ledger) at 8:15 AM GMT
  "*/30 * * * *",     # SLO check every 30 min
  "30 3 * * *",       # Retention cleanup (D1 ledger + R2 'dead' archive) at 3:30 AM GMT
  "0 * * * *"         # DLQ retry every hour
]

# Analytics Engine dataset for metrics
[[analytics_engine_datasets]]
binding = "TRACKING_METRICS"

# Email binding — Cloudflare Email Routing setup szükséges (lásd 00-pre-sprint-setup.md).
# Sprint 1 test-deploy alatt kikommentezve — destination verify (laszlo@soborbo.com)
# nélkül a deploy fail-elne. A kódbeli notify.ts soft-skip-pel megy ha nincs binding.
# Sprint 8.5-ben aktiváld vissza.
# [[send_email]]
# name = "ADMIN_EMAIL"
# destination_address = "laszlo@soborbo.com"

# KV namespaces (created via Cloudflare MCP, 2026-04-29)
[[kv_namespaces]]
binding = "SITE_CONFIG"
id = "edd34e28eee847c09c26f9d9e3ea04ab"

[[kv_namespaces]]
binding = "OAUTH_TOKENS"
id = "f464647802e24a5dac60cacd66a9876a"

# Turnstile token-verdikt cache (TASK 1). A kliens 4 percig újrahasználja a
# tokent; enélkül a binding nélkül a 2.+ event "timeout-or-duplicate"-tal 403-azna
# (konverzió-vesztés). A kód guardolt: binding nélkül a régi per-request verify
# marad. Élesítés: `wrangler kv namespace create TURNSTILE_CACHE` → id ide.
# [[kv_namespaces]]
# binding = "TURNSTILE_CACHE"
# id = "<wrangler kv namespace create kiírja>"

# Durable Objects — quote state (60-min upgrade window, strong consistency)
[[durable_objects.bindings]]
name = "QUOTE_STATE"
class_name = "QuoteStateObject"

[[migrations]]
tag = "v1"
new_classes = ["QuoteStateObject"]

# R2 bucket for dead-letter queue — EU jurisdiction (GDPR P0).
# The DLQ stores the RAW event payload (email/phone/name/address for retry), so
# EU-subject PII must reside in the EU jurisdiction. The active bucket below is
# `soborbo-tracking-dlq-eu` (location EEUR), created 2026-06-27 with:
#   wrangler r2 bucket create soborbo-tracking-dlq-eu --jurisdiction eu
# (the jurisdiction flag is settable ONLY at creation, and the Cloudflare MCP
#  create tool ignores it, so wrangler is required.)
#
# The previous bucket `soborbo-tracking-dlq` (DEFAULT/ENAM) is retained, NOT
# deleted: its 9 objects were verified to be test-only dead-letters (site_id
# `test-painless`, dated 2026-04-29, synthetic event IDs, all far past the 24h
# retry window), so the binding swap orphans nothing live. Delete it once the
# test archive is no longer wanted:  wrangler r2 bucket delete soborbo-tracking-dlq
[[r2_buckets]]
binding = "DEAD_LETTER"
bucket_name = "soborbo-tracking-dlq-eu"
jurisdiction = "eu"
# Old default/ENAM bucket (retained as frozen test archive — see note above):
# bucket_name = "soborbo-tracking-dlq"

# ── D1 ledger (events_raw / idempotency / deliveries / consent_receipts /
# lead_status) ───────────────────────────────────────────────────────────────
# A kód guardolt: amíg ez kommentben van (nincs LEDGER binding), a ledger-írás
# + idempotencia no-op (a Worker D1 nélkül is teljesen működik). Az offline-loop
# (/api/event/lead-status) D1 nélkül is feltölt Google Ads-be, csak nem naplóz.
# Élesítve 2026-06-26 (Cloudflare MCP): DB létrehozva (weur, EU-jurisdikció a
# GDPR-hez) + a migrations/0001_ledger.sql séma alkalmazva (5 tábla + 10 index).
# A binding a következő `wrangler deploy`-jal lép életbe.
[[d1_databases]]
binding = "LEDGER"
database_name = "event-gateway-ledger"
database_id = "8c7774d1-2eea-40ba-b99c-92e73055460f"
migrations_dir = "migrations"

# Routes — Sprint 9: Painless live, Sprint 10: 14 másik site rollout-tal.
# A Worker-kód már multi-tenant (hostname → SiteConfig KV); itt csak a
# Cloudflare zone routing van. Új site felvételekor 3 lépés:
#   1) Új KV-bejegyzés: wrangler kv:key put --binding=SITE_CONFIG "<host>" '...'
#   2) Új [[routes]] blokk itt + redeploy
#   3) Astro projekt: client-lib/ másolás + Turnstile widget + GTM tisztítás
#
# Sprint 1 test-deploy alatt MIND kikommentezve — Worker workers.dev URL-en él.
# Sprint 9 (Painless go-live): a Painless route-ok AKTÍV-ra kapcsolva.
# ⚠️ MERGE-ELÉS ELŐTT: a SITE_CONFIG KV-ban legyen "painlessremovals.com" és
#    "www.painlessremovals.com" bejegyzés (különben a route 404-et ad). Lásd GO-LIVE.md.
#
# A gateway SAJÁT domainje: tracking.soborbo.co.uk — JELENLEG a Cloudflare
# dashboardban kezelt custom domain, NINCS itt a deployban. Verziókövetésbe hozni
# = az alábbi blokk uncomment-je; ekkor a `wrangler deploy` átveszi a kezelését (a
# meglévő custom domaint reconcile-álja, nem törli). Go-live alatt NE most flippeld.
# [[routes]]
# pattern = "tracking.soborbo.co.uk"
# custom_domain = true

[[routes]]
pattern = "painlessremovals.com/api/event/*"
zone_name = "painlessremovals.com"

[[routes]]
pattern = "www.painlessremovals.com/api/event/*"
zone_name = "painlessremovals.com"

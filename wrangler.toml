name = "soborbo-tracking"
main = "src/worker.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "075668606da58c5b96a45a075f1ca99c"

[observability]
enabled = true
head_sampling_rate = 1.0

# Cron Triggers — DLQ retry, daily digest, SLO check
[triggers]
crons = [
  "0 8 * * *",        # Daily digest at 8 AM GMT
  "*/30 * * * *",     # SLO check every 30 min
  "0 * * * *"         # DLQ retry every hour
]

# Analytics Engine dataset for metrics
[[analytics_engine_datasets]]
binding = "TRACKING_METRICS"

# Email binding — Cloudflare Email Routing setup szükséges (lásd 00-pre-sprint-setup.md).
# Ha nincs domain konfigurálva, deploy ezzel a blokkkal fail-elhet — ilyenkor
# kommentezd ki és használd a kódbeli soft-skip-et.
[[send_email]]
name = "ADMIN_EMAIL"
destination_address = "laszlo@soborbo.com"

# KV namespaces (created via Cloudflare MCP, 2026-04-29)
[[kv_namespaces]]
binding = "SITE_CONFIG"
id = "edd34e28eee847c09c26f9d9e3ea04ab"

[[kv_namespaces]]
binding = "OAUTH_TOKENS"
id = "f464647802e24a5dac60cacd66a9876a"

# Durable Objects — quote state (60-min upgrade window, strong consistency)
[[durable_objects.bindings]]
name = "QUOTE_STATE"
class_name = "QuoteStateObject"

[[migrations]]
tag = "v1"
new_classes = ["QuoteStateObject"]

# R2 bucket for dead-letter queue
# NOTE: created with default jurisdiction (ENAM). Spec calls for EU (Belgium)
# for GDPR. If a re-creation is performed in the dashboard with eu jurisdiction,
# update bucket_name accordingly.
[[r2_buckets]]
binding = "DEAD_LETTER"
bucket_name = "soborbo-tracking-dlq"

# Routes — Sprint 1: only Painless. Multi-tenant rollout in Sprint 10.
[[routes]]
pattern = "painlessremovals.com/api/track/*"
zone_name = "painlessremovals.com"

[[routes]]
pattern = "www.painlessremovals.com/api/track/*"
zone_name = "painlessremovals.com"
